; aimfix.asi settings
[Aim]
; 1 = shots fire from the weapon toward what is under the crosshair (cover in
;     front of the gun blocks them); 0 = GTA default, shots fire from the camera
AlignShots=1
; where aimed shots start: Muzzle (the gun barrel) or Origin (GTA's point, above the gun)
ShotFrom=Muzzle

[Marker]
; X shown where the bullet will hit when something blocks the gun
Enabled=1
HideCrosshair=0
; texture from models\txd\<Txd>.txd
Txd=aimfix
Texture=x
; size in world metres, clamped to MinPx..MaxPx on screen
Size=0.18
MinPx=10
MaxPx=42
; RRGGBBAA
Colour=FF3C3CE6
MaxDistance=80
; metres the bullet must stop short of the crosshair target to count as blocked
Tolerance=0.3
; follow speed (1/s) and fade speed
Smoothing=20
Fade=12

[Tracer]
; line from the gun to where each of your aimed shots really hit
Enabled=1
; 1 = also show other players' tracers (not NPCs)
Others=1
; thickness in metres, lifetime in ms, opacity 0-255
Radius=0.02
TimeMs=300
Alpha=200

